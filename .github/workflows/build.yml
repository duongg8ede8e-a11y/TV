name: Build Beautified Mobile APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download Tools & Official Base APK
        run: |
          mkdir -p tools release_apks
          # Download Apktool & Uber-APK-Signer
          # Apktool 3.x 才能正确解出 state_dragged / state_swiped 这类属性并保留其资源 ID
          curl -sL https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -o tools/apktool.jar
          curl -sL https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -o tools/uber-apk-signer.jar
          
          # Download official release APKs (v5.6.8)
          echo "Downloading official base APKs..."
          curl -sL https://github.com/FongMi/Release/releases/download/5.6.8/mobile-arm64_v8a.apk -o base_arm64.apk
          curl -sL https://github.com/FongMi/Release/releases/download/5.6.8/mobile-armeabi_v7a.apk -o base_armv7.apk
          ls -lh base_*.apk

      - name: Decompile Base APKs
        run: |
          echo "Decompiling resources (-s mode preserves original DEX & native libs)..."
          java -jar tools/apktool.jar d base_arm64.apk -o apk_arm64 -s -f
          java -jar tools/apktool.jar d base_armv7.apk -o apk_armv7 -s -f

      - name: Inject Beautified UI Resources
        run: |
          echo "Applying modern streaming cinema UI patches..."
          python patch_apk.py apk_arm64
          python patch_apk.py apk_armv7

      - name: Rebuild Beautified APKs
        run: |
          echo "Rebuilding APKs with updated UI..."
          java -jar tools/apktool.jar b apk_arm64 -o unsigned_arm64.apk
          java -jar tools/apktool.jar b apk_armv7 -o unsigned_armv7.apk
          ls -lh unsigned_*.apk

      - name: Sign APKs
        run: |
          echo "Signing APKs with debug signature..."
          java -jar tools/uber-apk-signer.jar -a unsigned_arm64.apk --allowResign -o release_apks/
          java -jar tools/uber-apk-signer.jar -a unsigned_armv7.apk --allowResign -o release_apks/
          
          # Rename to clean filenames
          ls -la release_apks/
          for f in release_apks/*arm64*.apk; do
            if [ -f "$f" ]; then mv "$f" release_apks/FongMi-TV-Mobile-arm64_v8a-Beautified.apk; fi
          done
          for f in release_apks/*armv7*.apk; do
            if [ -f "$f" ]; then mv "$f" release_apks/FongMi-TV-Mobile-armeabi_v7a-Beautified.apk; fi
          done
          ls -lh release_apks/*.apk

      - name: Upload Beautified APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FongMi-TV-Mobile-Beautified-APKs
          path: release_apks/*.apk
          retention-days: 14
